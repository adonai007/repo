[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footy"
version = "0.1.0"
description = "Automated football match-prediction framework: deep-research inputs + Dixon-Coles / Monte Carlo engine (World Cup 2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "typer>=0.12",
]

[project.optional-dependencies]
data = ["soccerdata>=1.8"]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=7.4"]

[project.scripts]
footy = "footy.cli:app"

[tool.setuptools.packages.find]
include = ["footy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
